services:
  - type: web
    name: finsight-lite
    runtime: python
    buildCommand: pip install -r render-requirements.txt
    startCommand: python -m ml.run_pipeline && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: finsight-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DUCKDB_PATH
        value: /opt/render/project/src/data/warehouse.duckdb
      - key: CSV_PATH
        value: /opt/render/project/src/data/transactions.csv
      - key: CORS_ORIGINS
        sync: false   # set to your Netlify URL in the Render dashboard after first deploy
